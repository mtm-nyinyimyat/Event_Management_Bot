services:
  - type: web
    name: event-management-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3978
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: BOT_TYPE
        value: UserAssignedMsi
